{% extends 'boutique/base.html' %}
{% block content %}
<style>
.connexion-wrapper{max-width:420px;margin:4rem auto;padding:0 2rem}
.connexion-title{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:700;text-align:center;margin-bottom:0.5rem}
.connexion-title span{color:var(--gold);font-style:italic}
.connexion-sub{text-align:center;font-size:0.8rem;color:var(--gray);margin-bottom:2.5rem}
.form-group{margin-bottom:1.5rem}
.form-label{display:block;font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:0.5rem}
.form-input{width:100%;border:1px solid var(--border);padding:12px 16px;font-family:'Montserrat',sans-serif;font-size:0.85rem;outline:none;transition:border-color 0.3s;background:var(--white)}
.form-input:focus{border-color:var(--gold)}
.btn-connexion-submit{width:100%;background:var(--black);color:var(--white);border:none;padding:14px;font-family:'Montserrat',sans-serif;font-size:0.75rem;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:background 0.3s;margin-top:0.5rem}
.btn-connexion-submit:hover{background:var(--gold)}
.error-msg{background:#f8d7da;color:#721c24;padding:12px 16px;font-size:0.8rem;margin-bottom:1.5rem;text-align:center}
.register-link{text-align:center;margin-top:1.5rem;font-size:0.8rem;color:var(--gray)}
.register-link a{color:var(--gold);text-decoration:none}
.register-link a:hover{text-decoration:underline}
</style>

<div class="connexion-wrapper">
  <h1 class="connexion-title">Se <span>Connecter</span></h1>
  <p class="connexion-sub">Accédez à votre compte</p>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">Email *</label>
      <input type="email" name="email" class="form-input" required placeholder="votre@email.com">
    </div>
    <div class="form-group">
      <label class="form-label">Mot de passe *</label>
      <input type="password" name="password" class="form-input" required placeholder="Votre mot de passe">
    </div>
    <button type="submit" class="btn-connexion-submit">Se Connecter</button>
  </form>

  <p class="register-link">Pas encore de compte ? <a href="/inscription/">S'inscrire</a></p>
</div>
{% endblock %}
