{% extends 'boutique/base.html' %}
{% block content %}
<style>
.fav-container{max-width:900px;margin:0 auto;padding:3rem 2rem}
.fav-title{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.fav-title span{color:var(--gold);font-style:italic}
.fav-empty{text-align:center;padding:4rem;color:var(--gray)}
.fav-item{display:grid;grid-template-columns:70px 1fr auto;gap:1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--border)}
.fav-item-img{width:70px;height:70px;object-fit:cover;background:var(--cream);border:1px solid var(--border)}
.fav-item-img img{width:100%;height:100%;object-fit:cover}
.fav-nom{font-family:'Cormorant Garamond',serif;font-size:1.1rem;cursor:pointer;text-decoration:none;color:inherit;transition:color 0.3s}
.fav-nom:hover{color:var(--gold)}
.fav-prix{color:var(--gold);font-weight:600;font-size:0.9rem;margin-top:0.25rem}
.remove-btn{background:none;border:none;color:var(--gray);cursor:pointer;font-size:1rem}
.remove-btn:hover{color:red}
</style>

<div class="fav-container">
  <h2 class="fav-title">Mes <span>Favoris</span></h2>
  <div id="favContent"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
var currentUser = "{{ user.username }}";
var favsKey = 'favoris_' + currentUser;

function renderFavoris() {
  var favs = JSON.parse(localStorage.getItem(favsKey) || '[]');
  var container = document.getElementById('favContent');

  if (favs.length === 0) {
    container.innerHTML = '<div class="fav-empty"><p>Aucun favori pour le moment</p><br><a href="/catalogue/" class="btn-outline">Voir la Collection</a></div>';
    return;
  }

  var html = '<div id="items">';
  for (var i = 0; i < favs.length; i++) {
    var f = favs[i];
    html += '<div class="fav-item">';
    html += '<a href="/produit/' + f.id + '/" class="fav-item-img">';
    html += f.image ? '<img src="' + f.image + '" alt="">' : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem">🥻</div>';
    html += '</a>';
    html += '<div>';
    html += '<a href="/produit/' + f.id + '/" class="fav-nom">' + f.nom + (f.couleur ? ' — ' + f.couleur : '') + '</a>';
    html += '<p style="font-size:0.7rem;color:var(--gray)">' + (f.couleur ? 'Couleur: <strong>' + f.couleur + '</strong>' : '') + '</p>';
    html += '<p class="fav-prix">' + parseFloat(f.prix).toFixed(3) + ' DT</p>';
    html += '</div>';
    html += '<button class="remove-btn" onclick="removeFav(' + i + ')">✕</button>';
    html += '</div>';
  }
  html += '</div>';
  container.innerHTML = html;
}

function removeFav(idx) {
  var favs = JSON.parse(localStorage.getItem(favsKey) || '[]');
  favs.splice(idx, 1);
  localStorage.setItem(favsKey, JSON.stringify(favs));
  updateFavCount();
  renderFavoris();
}

renderFavoris();
</script>
{% endblock %}
